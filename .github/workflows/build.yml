name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source
        run: |
          mkdir -p /tmp/src
          unzip -o -q kefu-src.zip -d /tmp/src
          cp -a /tmp/src/. .
          rm -f kefu-src.zip
          ls -R app/src | head -40
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.6
        run: |
          cd /tmp
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip -d /opt
          echo /opt/gradle-8.6/bin >> $GITHUB_PATH
          gradle --version
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kefu-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
