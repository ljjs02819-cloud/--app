name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          if [ -f kefu-apk-src-v3.tar.gz ]; then
            tar xzf kefu-apk-src-v3.tar.gz
            echo "extracted"
          fi
          ls -la

      - name: Verify project layout
        run: |
          test -f settings.gradle || exit 1
          test -f app/build.gradle || exit 1
          test -f local.properties || exit 1
          echo "layout ok"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kefu-apk
          path: app/build/outputs/apk/debug/*.apk
