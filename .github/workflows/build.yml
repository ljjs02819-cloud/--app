name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source
        run: |
          mkdir -p /tmp/src
          unzip -o -q kefu-src.zip -d /tmp/src
          cp -a /tmp/src/. .
          rm -f kefu-src.zip
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Gradle
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tail -3 || true
          cd /tmp
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip -d /opt
          echo /opt/gradle-8.6/bin >> $GITHUB_PATH
      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            sed -n '/FAILURE: Build failed/,/BUILD FAILED/p' /tmp/build.log | head -50 > /tmp/block.txt
            while IFS= read -r line; do
              SAFE=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
              echo "::error title=G::${SAFE}"
            done < /tmp/block.txt
            grep -n 'Caused by' /tmp/build.log | head -10
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kefu-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
