name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source
        run: |
          mkdir -p /tmp/src
          unzip -o -q kefu-src.zip -d /tmp/src
          cp -a /tmp/src/. .
          rm -f kefu-src.zip
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Gradle
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tail -3 || true
          cd /tmp
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip -d /opt
          echo /opt/gradle-8.6/bin >> $GITHUB_PATH
      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1 ; echo rc=$? ; tail -c 60000 /tmp/build.log > /tmp/short.log
      - name: Publish log on failure
        if: steps.build.outcome == 'failure'
        run: |
          B64=$(base64 -w0 /tmp/short.log)
          SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" ${{ github.api_url }}/repos/${{ github.repository }}/contents/build-log.txt | python3 -c 'import sys,json;print(json.load(sys.stdin).get("sha",""))' 2>/dev/null)
          if [ -z "$SHA" ]; then
            python3 -c "import json,os;open('/tmp/p.json','w').write(json.dumps({'message':'build log','content':os.environ['B64'],'branch':'main'}))"
          else
            python3 -c "import json,os;open('/tmp/p.json','w').write(json.dumps({'message':'build log','content':os.environ['B64'],'branch':'main','sha':os.environ['SHA']}))"
          fi
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" -d @/tmp/p.json ${{ github.api_url }}/repos/${{ github.repository }}/contents/build-log.txt
          exit 1
      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kefu-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
