name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          mkdir -p /tmp/src
          unzip -o -q kefu-src.zip -d /tmp/src
          cp -a /tmp/src/. .
          rm -f kefu-src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        id: b
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tail -2
          cd /tmp && curl -sSL -o g.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip && unzip -q g.zip -d /opt
          cd $GITHUB_WORKSPACE
          echo '## Gradle result' >> $GITHUB_STEP_SUMMARY
          /opt/gradle-8.6/bin/gradle assembleDebug --no-daemon > out.txt 2>&1
          echo "exit=$?" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'error:|FAILURE|What went wrong|> |Could not' out.txt | head -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -l app/build/outputs/apk/debug/ 2>&1 | head >> $GITHUB_STEP_SUMMARY
      - name: Save log
        if: always()
        run: |
          cp out.txt build-log.txt || true
          git config user.email a@b.c && git config user.name bot
          git add -f build-log.txt && git commit -m 'log' || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            out.txt
            build-log.txt
          if-no-files-found: warn
