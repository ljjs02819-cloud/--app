name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source
        run: |
          mkdir -p /tmp/src
          unzip -o -q kefu-src.zip -d /tmp/src
          cp -a /tmp/src/. .
          rm -f kefu-src.zip
          ls -R app/src/main | head -60
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Gradle
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tail -5 || true
          cd /tmp
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip -d /opt
          echo /opt/gradle-8.6/bin >> $GITHUB_PATH
      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo '===== GRADLE TAIL ====='
            tail -80 /tmp/build.log
            echo '===== FIRST ERROR ====='
            grep -m3 -E 'error:|FAILURE:|Could not|What went wrong' /tmp/build.log || true
            MSG=$(grep -m1 -E 'error:|Could not resolve|What went wrong|FAILURE:' /tmp/build.log | cut -c1-120)
            echo "::error title=Gradle failed::${MSG}"
            exit 1
          fi
          ls -l app/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kefu-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
