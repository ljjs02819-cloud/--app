name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          mkdir -p /tmp/src
          unzip -o -q kefu-src.zip -d /tmp/src
          rm -rf app build.gradle settings.gradle gradle.properties gradle
          cp -a /tmp/src/. .
          rm -f kefu-src.zip
          ls -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        id: b
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tail -2
          if [ ! -x /opt/gradle-8.6/bin/gradle ]; then
            curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
            unzip -q /tmp/g.zip -d /opt
          fi
          echo '## Gradle result' >> $GITHUB_STEP_SUMMARY
          /opt/gradle-8.6/bin/gradle assembleDebug --no-daemon --stacktrace > out.txt 2>&1
          EX=$?
          echo "exit=$EX" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'error:|FAILURE|What went wrong|Could not|Duplicate' out.txt | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -l app/build/outputs/apk/debug/ 2>&1 | head >> $GITHUB_STEP_SUMMARY || true
          exit $EX
      - name: Report log
        if: always()
        run: |
          tail -60 out.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: out.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kefu-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
